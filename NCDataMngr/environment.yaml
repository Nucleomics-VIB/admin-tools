## software requirements for the whole project
# file: environment.yaml
# this file is meant to install all dependencies using conda
# search for dependencies at https://anaconda.org/conda-forge/repo
# please include a validated version number as minimal version
# and test more recent versions before editing this file

################################################################################
# !! this is only a beta version, it will require refinements before being used
################################################################################

# create env with this file:
# conda env create --file environment.yaml

name: NDCDataMngr_env

channels:
  - conda-forge
  - bioconda
  - nodefaults

# examples
# specific version
#  - numpy=1.9.*
# specify version range 
#  - numpy>=1.2.3, <1.3
# specify the channel
#  - conda-forge::beautifulsoup4

dependencies:
  # eMudhra CA incident (2026-10-20, #6): certifi 2026.10.19 needs python >=3.11
  - conda-forge::python>=3.11
  - gawk>=5.1.0
  - conda-forge::sqlite>=3.33.0
  - conda-forge::coreutils>=8.3.*
  - conda-forge::certifi>=2026.10.19
  - conda-forge::ca-certificates

#  - pip:
#    - git+https://github.com/blaze/dask.git#egg=dask[complete]
